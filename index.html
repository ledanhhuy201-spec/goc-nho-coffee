<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Góc Nhỏ Coffee</title>
<meta name="description" content="Góc Nhỏ Coffee: quán cà phê khởi nghiệp của Nguyễn Linh Đan, mang hương vị Đắk Lắk về phố và dùng tiền lãi mở workshop miễn phí cho các em nhỏ.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236b2817'/%3E%3Cpath d='M7 25V12a5 5 0 0 1 5-5h13' fill='none' stroke='%23f7f2e9' stroke-width='3' stroke-linecap='round'/%3E%3Cellipse cx='18.5' cy='18.5' rx='4.6' ry='6.4' transform='rotate(-38 18.5 18.5)' fill='%23e6b86a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&amp;display=swap">
<style id="gn-css">
:root{
  /* Layout: basalt-red hero with a dripping phin, then the founder's note, a four-stop route,
     a leaf-green workshop band; the revenue ledger is its own view (#ledger). Single light theme. */
  --bean:#edefe6;
  --bean-2:#e2e5d8;
  --paper:#fbfbf7;
  --roast:#2a1b12;
  --roast-2:#5c4a3e;
  --muted:#6c6057;
  --line:rgba(42,27,18,.14);
  --grid:#e6e5dd;
  --basalt:#6b2817;
  --basalt-deep:#57200f;
  --leaf:#21463a;
  --cherry:#a51e2b;
  --crema:#e6b86a;
  --milk:#f7f2e9;
  --rev:#1b7a55;
  --cost:#c07a12;
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --wrap:1180px;
  --pad:clamp(20px,4vw,40px);
  --nav-h:68px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bean);color:var(--roast);font-family:var(--f-body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
svg{display:block}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
p{margin:0}
:focus-visible{outline:2px solid var(--cherry);outline-offset:3px;border-radius:6px}
.hero :focus-visible,.workshops :focus-visible,.nav.on-dark :focus-visible,.kpi.fund :focus-visible,.pending :focus-visible{outline-color:var(--crema)}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.h-display{font-family:var(--f-display);font-weight:700;font-stretch:84%;font-variation-settings:"opsz" 72;font-size:clamp(34px,4.6vw,56px);line-height:1.1;letter-spacing:-.012em;margin:0 0 20px;text-wrap:balance}

/* ---------- nav ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:40;color:var(--roast);background:rgba(237,239,230,.94);-webkit-backdrop-filter:saturate(1.3) blur(10px);backdrop-filter:saturate(1.3) blur(10px);border-bottom:1px solid var(--line);transition:background-color .25s,color .25s,border-color .25s;--logo-cut:var(--bean);--logo-bean:var(--cherry)}
.nav.on-dark{background:transparent;border-bottom-color:transparent;color:var(--milk);-webkit-backdrop-filter:none;backdrop-filter:none;--logo-cut:var(--basalt);--logo-bean:var(--crema)}
.nav-in{display:flex;align-items:center;gap:16px;height:var(--nav-h)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;color:inherit;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.01em;line-height:1;white-space:nowrap}
.brand small{font-family:var(--f-body);font-weight:500;font-size:14px;letter-spacing:0;opacity:.72;margin-left:2px}
.logo .cut{stroke:var(--logo-cut)}
.logo .bean{fill:var(--logo-bean)}
.nav-links{display:flex;align-items:center;gap:2px;margin-left:auto}
.nav-link{background:none;border:0;padding:8px 12px;border-radius:8px;font-size:15px;font-weight:500;color:inherit;white-space:nowrap}
.nav-link:hover{background:rgba(42,27,18,.07)}
.nav.on-dark .nav-link:hover{background:rgba(247,242,233,.12)}
.nav-link[aria-current="page"]{box-shadow:inset 0 -2px 0 currentColor;border-radius:0}
.lang{display:flex;flex:none;border:1px solid currentColor;border-radius:9px;overflow:hidden;margin-left:8px}
.lang button{background:none;border:0;padding:6px 10px;font-size:13px;font-weight:600;line-height:1.2;color:inherit;min-width:40px}
.lang button[aria-pressed="true"]{background:var(--roast);color:var(--milk)}
.nav.on-dark .lang button[aria-pressed="true"]{background:var(--milk);color:var(--roast)}
.menu-btn{display:none;background:none;border:1px solid currentColor;border-radius:9px;padding:6px 12px;font-size:14px;font-weight:600;color:inherit}
@media (max-width:860px){
  .nav-links{display:none}
  .lang{margin-left:auto}
  .menu-btn{display:inline-flex}
  .nav-links.open{display:flex;position:absolute;top:var(--nav-h);left:0;right:0;flex-direction:column;align-items:stretch;gap:2px;background:var(--bean);color:var(--roast);padding:8px var(--pad) 18px;border-bottom:1px solid var(--line);box-shadow:0 14px 30px rgba(42,27,18,.12)}
  .nav-links.open .nav-link{text-align:left;padding:12px 10px;font-size:17px}
  .nav-links.open .nav-link[aria-current="page"]{box-shadow:inset 3px 0 0 var(--cherry);border-radius:0 8px 8px 0}
}
@media (max-width:400px){.brand small{display:none}}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--basalt);color:var(--milk);padding:calc(var(--nav-h) + 56px) 0 80px}
.contours{position:absolute;inset:0;width:100%;height:100%;color:rgba(247,242,233,.085);pointer-events:none}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(24px,5vw,72px);align-items:center}
.hero h1{font-family:var(--f-display);font-weight:700;font-stretch:76%;font-variation-settings:"opsz" 96;font-size:clamp(50px,7.4vw,104px);line-height:1.06;letter-spacing:-.018em;margin:0 0 28px;max-width:11.5ch;text-wrap:balance}
.hero-lede{font-size:clamp(17px,1.45vw,20px);line-height:1.6;max-width:33em;color:rgba(247,242,233,.88);margin-bottom:32px}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px}
.hero-by{display:flex;align-items:center;gap:12px;margin-top:36px;font-size:15px;color:rgba(247,242,233,.78)}
.hero-by::before{content:"";width:18px;height:18px;flex:none;border-left:2px solid var(--crema);border-top:2px solid var(--crema);border-top-left-radius:5px}
.hero-art{justify-self:center;width:min(100%,420px)}
.phin{width:100%;height:auto;overflow:visible}
.phin .coffee{transform-box:fill-box;transform-origin:50% 100%;animation:gn-fill 6s cubic-bezier(.22,.7,.3,1) .5s both}
.phin .drop{opacity:0;transform-box:view-box;animation:gn-drop 1.6s cubic-bezier(.55,0,.85,.55) .3s 4,gn-drop-slow 4.8s cubic-bezier(.55,0,.85,.55) 6.7s infinite}
.phin .drop.d2{animation-delay:1.1s,9.1s}
@keyframes gn-fill{from{transform:scaleY(.32)}to{transform:scaleY(1)}}
@keyframes gn-drop{0%{opacity:0;transform:translateY(0) scale(.5)}12%{opacity:1;transform:translateY(0) scale(1)}88%{opacity:1}100%{opacity:0;transform:translateY(142px)}}
@keyframes gn-drop-slow{0%{opacity:0;transform:translateY(0) scale(.5)}4%{opacity:1;transform:translateY(0) scale(1)}30%{opacity:1}34%,100%{opacity:0;transform:translateY(142px)}}
@media (prefers-reduced-motion:reduce){
  .phin .coffee{animation:none}
  .phin .drop{animation:none;opacity:0}
  .nav,.toast,.tab{transition:none}
}
@media (max-width:860px){
  .hero{padding:calc(var(--nav-h) + 36px) 0 56px}
  .hero-grid{grid-template-columns:1fr}
  .hero-art{width:min(74%,300px);margin-top:8px}
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:10px;border:1.5px solid transparent;font-weight:600;font-size:16px;line-height:1.2;text-decoration:none;white-space:nowrap}
.btn-crema{background:var(--crema);color:var(--roast)}
.btn-crema:hover{background:#efc882}
.btn-line-light{border-color:rgba(247,242,233,.6);color:var(--milk);background:transparent}
.btn-line-light:hover{background:rgba(247,242,233,.1)}
.btn-dark{background:var(--roast);color:var(--milk)}
.btn-dark:hover{background:#3d2a1e}
.btn-line{border-color:rgba(42,27,18,.28);background:transparent;color:var(--roast)}
.btn-line:hover{background:rgba(42,27,18,.05)}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;cursor:default}

/* ---------- sections ---------- */
.section{padding:clamp(72px,10vw,128px) 0;scroll-margin-top:var(--nav-h)}
.story-grid{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:clamp(32px,6vw,96px);align-items:start}
.story-side{color:var(--roast-2);max-width:28em}
.quote{position:relative;margin:0;padding:40px 0 0 40px}
.quote::before{content:"";position:absolute;left:0;top:0;width:48px;height:48px;border-left:4px solid var(--cherry);border-top:4px solid var(--cherry);border-top-left-radius:12px}
.quote blockquote{margin:0}
.quote blockquote p{font-family:var(--f-display);font-weight:400;font-stretch:96%;font-variation-settings:"opsz" 36;font-size:clamp(23px,2.45vw,33px);line-height:1.42;letter-spacing:-.006em;max-width:27em}
.quote figcaption{display:flex;align-items:center;gap:12px;margin-top:28px;font-size:15px;font-weight:500;color:var(--roast-2)}
.quote figcaption::before{content:"";width:28px;height:2px;background:currentColor}
@media (max-width:860px){.story-grid{grid-template-columns:1fr}.quote{padding:32px 0 0 28px}.quote::before{width:36px;height:36px}}

.journey{background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.route{list-style:none;margin:52px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px;position:relative}
.route::before{content:"";position:absolute;left:28px;right:28px;top:28px;border-top:2px dotted rgba(42,27,18,.38)}
.stop{position:relative}
.stop-mark{position:relative;z-index:1;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:1.5px solid var(--roast);color:var(--roast)}
.stop-mark svg{width:26px;height:26px}
.stop:last-child .stop-mark{background:var(--leaf);border-color:var(--leaf);color:var(--milk)}
.stop-n{position:absolute;top:-6px;right:-8px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--cherry);color:var(--milk);font-family:var(--f-display);font-size:13px;font-weight:700;line-height:1}
.stop h3{font-family:var(--f-display);font-weight:650;font-stretch:92%;font-size:23px;line-height:1.2;letter-spacing:-.006em;margin:22px 0 8px}
.stop p{color:var(--roast-2);font-size:16px;line-height:1.6;max-width:24em}
@media (max-width:860px){
  .route{grid-template-columns:1fr;gap:34px}
  .route::before{left:27px;right:auto;top:28px;bottom:28px;border-top:0;border-left:2px dotted rgba(42,27,18,.38)}
  .stop{display:grid;grid-template-columns:56px minmax(0,1fr);column-gap:20px}
  .stop-mark{grid-row:1 / span 2}
  .stop h3{margin:12px 0 6px}
}

.workshops{background:var(--leaf);color:var(--milk)}
.ws-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(32px,6vw,88px);align-items:start}
.ws-lede{color:rgba(247,242,233,.86);max-width:30em}
.ws-stats{display:grid;grid-template-columns:auto minmax(0,1fr);margin-top:40px;max-width:30em}
.stat{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-columns:subgrid;grid-column:1 / -1;column-gap:20px;align-items:baseline;padding:16px 0;border-top:1px solid rgba(247,242,233,.24)}
.stat:last-child{border-bottom:1px solid rgba(247,242,233,.24)}
.stat-v{font-family:var(--f-display);font-weight:700;font-stretch:88%;font-size:clamp(36px,3.8vw,48px);line-height:1;color:var(--crema);text-align:right}
.stat-l{font-size:16px;line-height:1.4;color:rgba(247,242,233,.86)}
.tracks{display:grid}
.track{display:grid;grid-template-columns:76px minmax(0,1fr);gap:22px;align-items:start;padding:30px 0;border-top:1px solid rgba(247,242,233,.24)}
.track:last-child{border-bottom:1px solid rgba(247,242,233,.24)}
.track svg{width:76px;height:76px}
.track h3{font-family:var(--f-display);font-weight:650;font-stretch:92%;font-size:28px;line-height:1.15;margin:0 0 8px}
.track p{color:rgba(247,242,233,.86)}
.ws-recent{margin-top:72px}
.ws-recent h3{font-family:var(--f-display);font-weight:650;font-size:22px;margin:0 0 16px}
.ws-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ws-item{border:1px solid rgba(247,242,233,.26);border-radius:14px;padding:16px 18px 18px}
.ws-date{font-size:14px;color:rgba(247,242,233,.72)}
.ws-title{font-weight:600;font-size:17px;line-height:1.35;margin:6px 0 8px;overflow-wrap:anywhere}
.ws-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:rgba(247,242,233,.85)}
.ws-chip{display:inline-flex;align-items:center;gap:6px}
.ws-chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--crema)}
.ws-chip.coffee::before{background:#c98b5a}
.ws-empty{display:flex;align-items:center;gap:14px;padding:20px 22px;border:1px dashed rgba(247,242,233,.4);border-radius:14px;color:rgba(247,242,233,.9);max-width:36em}
@media (max-width:860px){.ws-grid{grid-template-columns:1fr}.ws-recent{margin-top:48px}}

.footer{padding:40px 0 56px;border-top:1px solid var(--line);font-size:14px;color:var(--roast-2)}
.footer-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px}
.footer .brand{font-size:18px;color:var(--roast);--logo-cut:var(--bean);--logo-bean:var(--cherry)}
.footer-text{display:grid;gap:2px;max-width:36em}

/* ---------- ledger ---------- */
.ledger{padding:calc(var(--nav-h) + 40px) 0 128px}
.ledger-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px}
.ledger-head h1{font-family:var(--f-display);font-weight:700;font-stretch:82%;font-variation-settings:"opsz" 72;font-size:clamp(38px,5.2vw,62px);line-height:1.04;letter-spacing:-.014em;margin:0 0 8px}
.ledger-lede{color:var(--roast-2);max-width:38em}
.meta-line{font-size:14px;color:var(--muted);margin-top:6px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 18px}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid rgba(42,27,18,.2);background:var(--paper);font-size:15px;font-weight:500;color:var(--roast)}
.chip:hover{border-color:rgba(42,27,18,.45)}
.chip[aria-pressed="true"]{background:var(--roast);border-color:var(--roast);color:var(--milk)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px 18px;min-width:0}
.kpi-l{display:block;font-size:14px;font-weight:500;color:var(--roast-2)}
.kpi-v{display:block;margin-top:8px;font-weight:600;font-size:clamp(21px,2.1vw,27px);line-height:1.15;letter-spacing:-.012em;overflow-wrap:anywhere}
.kpi-s{display:block;margin-top:6px;font-size:13.5px;line-height:1.4;color:var(--muted)}
.kpi.fund{background:var(--leaf);border-color:var(--leaf);color:var(--milk)}
.kpi.fund .kpi-l,.kpi.fund .kpi-s{color:rgba(247,242,233,.82)}
@media (max-width:940px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ledger-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.ledger-grid.has-side{grid-template-columns:minmax(0,1fr) 344px}
.ledger-main{display:grid;gap:20px;min-width:0}
.ledger-side{display:grid;gap:16px}
@media (max-width:1060px){.ledger-grid.has-side{grid-template-columns:minmax(0,1fr)}.ledger-side{position:static;order:-1}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 22px 22px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:14px}
.panel-t{font-family:var(--f-body);font-size:18px;font-weight:600;line-height:1.3;margin:0}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--roast-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px}
.link-btn{background:none;border:0;padding:4px 0;font-size:14px;font-weight:500;color:var(--roast);text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(42,27,18,.35)}
.link-btn:hover{text-decoration-color:currentColor}
.panel-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.chart{position:relative}
.chart svg{overflow:visible}
.chart text{font-family:var(--f-body)}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .axis{stroke:#c7c3b7;stroke-width:1}
.chart .tick,.chart .xl{font-size:12px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .xl.yr{font-size:11px}
.chart .dl{font-size:12px;font-weight:600;fill:var(--roast)}
.chart .band{outline:none}
.chart .band .hit{fill:transparent}
.chart .band:hover .hit,.chart .band:focus-visible .hit,.chart .band.on .hit{fill:rgba(42,27,18,.055)}
.chart .band.dim .bar{opacity:.34}
.chart .band:focus-visible .hit{stroke:var(--cherry);stroke-width:1.5}
.tip{position:absolute;left:0;top:0;z-index:5;pointer-events:none;min-width:190px;padding:10px 12px 11px;border-radius:10px;background:var(--roast);color:var(--milk);font-size:13px;line-height:1.45;box-shadow:0 8px 26px rgba(42,27,18,.22);opacity:0;transition:opacity .12s}
.tip.show{opacity:1}
.tip-h{font-weight:600;margin-bottom:6px;color:rgba(247,242,233,.9)}
.tip-row{display:flex;align-items:center;gap:8px;white-space:nowrap}
.tip-key{width:12px;height:3px;border-radius:2px;flex:none}
.tip-row b{font-weight:600;font-variant-numeric:tabular-nums}
.tip-row i{font-style:normal;color:rgba(247,242,233,.72)}
.tip-sep{height:1px;background:rgba(247,242,233,.18);margin:6px 0}
.chart-empty{display:grid;place-items:center;min-height:200px;text-align:center;color:var(--roast-2);font-size:15px;border:1px dashed rgba(42,27,18,.2);border-radius:12px;padding:20px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-weight:500;font-size:13px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl .num{text-align:right}
.tbl-wrap{overflow-x:auto}
.bars{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.bar-row{display:grid;gap:6px}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:15px}
.bar-top b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar-top b small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.bar-track{height:10px;border-radius:0 4px 4px 0;background:#eeede6;overflow:hidden}
.bar-fill{display:block;height:100%;border-radius:0 4px 4px 0;min-width:2px}
.muted-note{font-size:15px;color:var(--roast-2)}
.entries{list-style:none;margin:0;padding:0}

  function modelCalc(m) {
    var fixed = m.rent + m.staff + m.other;
    var cupsMonth = m.cups * m.days;

    var revenue = cupsMonth * m.price;
    var profit = cupsMonth * unitGross - fixed;
    var fund = Math.max(0, profit) * m.fundPct / 100;
    return {
      fixed: fixed, cupsMonth: cupsMonth, unitGross: unitGross, revenue: revenue, profit: profit, fund: fund,
      sessions: m.wsCost > 0 ? Math.floor(fund / m.wsCost) : null,
      beExact: unitGross > 0 && m.days > 0 ? fixed / (unitGross * m.days) : null,
      be: unitGross > 0 && m.days > 0 ? Math.ceil(fixed / (unitGross * m.days)) : null,
      profitAt: function (c) { return c * m.days * unitGross - fixed; }
    };
  }
  function lum(hex) {
    function f(i) { var x = parseInt(hex.slice(i, i + 2), 16) / 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); }
    return 0.2126 * f(1) + 0.7152 * f(3) + 0.0722 * f(5);
  }
  function cupHTML(c, m, width) {
    var h = '<h3 class="cup-h">' + esc(t('cup_h', money(m.price))) + '</h3>';

      : [['ing', Math.min(ing, m.price)], ['fixed', Math.max(0, m.price - ing)]];
    parts = parts.filter(function (p) { return p[1] >= 1; });
    var avail = Math.max(1, width - (parts.length - 1) * 2), bar = '', legend = '', aria = [];
    parts.forEach(function (p) {
      var name = t('part_' + p[0]), share = p[1] / m.price, label = kPrice(p[1]);

      var col = CUP_COLORS[p[0]], ink = lum(col) > 0.2 ? '#2a1b12' : '#ffffff';
      bar += '<span class="seg" style="flex:' + share.toFixed(4) + ' 1 0;background:' + col + ';color:' + ink + '">' + (fits ? esc(label) : '') + '</span>';
      legend += '<li><i class="sw" style="background:' + col + '"></i>' + esc(name) + (fits ? '' : ' <b>' + esc(label) + '</b>') + '</li>';

    return h;
  }
  function niceRange(lo, hi) {
    if (!(hi > lo)) hi = lo + 1;
    var raw = (hi - lo) / 4, p = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), steps = [1, 2, 2.5, 5, 10], step = p * 10;
    for (var i = 0; i < steps.length; i++) { if (steps[i] * p >= raw) { step = steps[i] * p; break; } }
    var a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, out = [];
    for (var v = a; v <= b + step / 1000; v += step) out.push(Math.round(v));
    return out;
  }
  var modelW = -1;
  function drawModelChart(c, m) {
    var host = document.getElementById('m-chart');
    if (!host) return;
    modelW = Math.floor(host.clientWidth);
    var W = Math.max(260, modelW), narrow = W < 480;
    var H = narrow ? 230 : 260, padL = 52, padR = 14, padT = 18, padB = 42;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var xMax = Math.min(400, Math.max(100, Math.ceil(Math.max(m.cups * 1.4, (c.be || 0) * 1.6) / 50) * 50));
    var p0 = c.profitAt(0), p1 = c.profitAt(xMax);
    var ticks = niceRange(Math.min(0, p0, p1), Math.max(0, p0, p1));
    var y0 = ticks[0], y1 = ticks[ticks.length - 1];
    function X(v) { return padL + v / xMax * plotW; }
    function Y(v) { return padT + (y1 - v) / (y1 - y0) * plotH; }
    var s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' +
      esc(t('mchart_aria') + '. ' + (c.be === null ? t('be_none') : t('be_text', c.be))) + '">';
    ticks.forEach(function (tv) {

        '<text class="tick" x="' + (padL - 8) + '" y="' + (yy + 4) + '" text-anchor="end">' + esc(compact(tv)) + '</text>';
    });
    var xStep = xMax <= 150 ? 25 : (narrow && xMax > 250 ? 100 : 50);
    for (var xv = 0; xv <= xMax; xv += xStep) {

    }
    s += '<text class="xl" x="' + (W - padR) + '" y="' + (padT + plotH + 35) + '" text-anchor="end">' + esc(t('x_unit')) + '</text>';
    if (c.beExact !== null && c.beExact < xMax) {
      s += '<path class="parea" d="M' + X(c.beExact).toFixed(1) + ' ' + Y(0).toFixed(1) + 'L' + X(xMax).toFixed(1) + ' ' + Y(p1).toFixed(1) +
        'L' + X(xMax).toFixed(1) + ' ' + Y(0).toFixed(1) + 'Z"/>';
    }
    s += '<line class="pline" x1="' + X(0).toFixed(1) + '" y1="' + Y(p0).toFixed(1) + '" x2="' + X(xMax).toFixed(1) + '" y2="' + Y(p1).toFixed(1) + '"/>';
    if (c.beExact !== null && c.beExact <= xMax) {
      var bx = X(c.beExact), by = Y(0);
      s += '<circle class="mk" cx="' + bx.toFixed(1) + '" cy="' + by.toFixed(1) + '" r="5"/>' +
        '<text class="ml" x="' + Math.max(padL + 4, bx - 9).toFixed(1) + '" y="' + (by - 10).toFixed(1) + '" text-anchor="' + (bx - 9 < padL + 70 ? 'start' : 'end') + '">' +
        esc(t('be_label') + ' ' + c.be) + '</text>';
    }
    var cx = X(m.cups), cy = Y(c.profit);
    s += '<circle class="mk cur" cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="5.5"/>' +
      '<text class="ml" x="' + (cx + 10).toFixed(1) + '" y="' + (cy + 18).toFixed(1) + '">' + esc(cmoney(Math.round(c.profit))) + '</text>';
    s += '<line class="xh" id="m-xh" x1="0" x2="0" y1="' + padT + '" y2="' + (padT + plotH) + '" visibility="hidden"/>' +
      '<circle class="mk hov" id="m-hd" cx="0" cy="0" r="4.5" visibility="hidden"/>' +
      '<rect id="m-hit" x="' + padL + '" y="' + padT + '" width="' + plotW + '" height="' + plotH + '" fill="transparent"/>';
    s += '</svg><div class="tip" id="m-tip" aria-hidden="true"></div>';
    host.innerHTML = s;
    host.style.height = H + 'px';

    var hit = host.querySelector('#m-hit'), xh = host.querySelector('#m-xh'), hd = host.querySelector('#m-hd'), tip = host.querySelector('#m-tip');
    function row(val, name, key) {
      var r = document.createElement('div'); r.className = 'tip-row';
      var k = document.createElement('span'); k.className = 'tip-key'; if (key) k.style.background = key;
      var b = document.createElement('b'); b.textContent = val;
      var i = document.createElement('i'); i.textContent = name;
      r.appendChild(k); r.appendChild(b); r.appendChild(i); return r;
    }
    function move(ev) {
      var box = host.getBoundingClientRect();
      var px = ev.clientX - box.left;

      var pv = c.profitAt(cups), xx = X(cups), yy = Y(pv);
      xh.setAttribute('x1', xx); xh.setAttribute('x2', xx); xh.setAttribute('visibility', 'visible');
      hd.setAttribute('cx', xx); hd.setAttribute('cy', yy); hd.setAttribute('visibility', 'visible');
      tip.textContent = '';
      var hdr = document.createElement('div'); hdr.className = 'tip-h'; hdr.textContent = t('tip_cups', cups); tip.appendChild(hdr);
      tip.appendChild(row(money(Math.round(cups * m.days * m.price)), t('mt_rev'), null));
      tip.appendChild(row(money(Math.round(pv)), t('mt_profit'), '#f7f2e9'));
      tip.appendChild(row(money(Math.round(Math.max(0, pv) * m.fundPct / 100)), t('mt_fund'), null));
      var tw = tip.offsetWidth, th = tip.offsetHeight;
      var left = xx + 14 + tw > W ? xx - 14 - tw : xx + 14;
      var top = Math.max(0, Math.min(H - th, yy - th / 2));

      tip.classList.add('show');

      xh.setAttribute('visibility', 'hidden'); hd.setAttribute('visibility', 'hidden'); tip.classList.remove('show');

    hit.addEventListener('pointermove', move);
    hit.addEventListener('pointerdown', move);

    if (state.view !== 'home' || !tiles) return;
    var m = state.model, c = modelCalc(m);
    var margin = c.revenue > 0 ? Math.round(c.profit / c.revenue * 100) : null;
    function tile(label, value, sub, cls) {
      return '<div class="kpi' + (cls ? ' ' + cls : '') + '"><span class="kpi-l">' + esc(label) + '</span><span class="kpi-v">' + esc(value) + '</span>' +
        (sub ? '<span class="kpi-s">' + esc(sub) + '</span>' : '') + '</div>';
    }
    tiles.innerHTML =
      tile(t('mt_rev'), money(Math.round(c.revenue)), t('cups_month', c.cupsMonth)) +
      tile(t('mt_profit'), money(Math.round(c.profit)), margin === null ? '' : t('kpi_profit_s', (margin < 0 ? '−' : '') + Math.abs(margin))) +
      tile(t('mt_fund'), money(Math.round(c.fund)), t('mt_fund_s', m.fundPct), 'fund') +
      tile(t('mt_ws'), c.sessions === null ? '—' : t('sessions_n', c.sessions), c.sessions === null ? t('mt_ws_free') : t('mt_ws_s', money(m.wsCost))) +
      '<p class="m-be">' + esc(c.be === null ? t('be_none') : t('be_text', c.be)) + '</p>';
    var cup = document.getElementById('m-cup');
    if (cup) cup.innerHTML = cupHTML(c, m, Math.max(200, cup.clientWidth - 48));

    var act = document.getElementById('m-actual');

    if (state.edit !== 'yes' || state.demo) return;

    removeOps(function (op) { return op.op === 'setPlan' || op.op === 'setFund'; });

    var fp = Math.max(0, Math.min(100, Math.round(m.fundPct)));
    if (fp !== SAVED.fundPct) { pushOp({ op: 'setFund', value: fp }); changed = true; }
    renderPending();
    toast(changed ? t('plan_set') : t('plan_same'));
  }

  function footerHTML() {
    return '<footer class="footer"><div class="wrap footer-in">' +
      '<button class="brand" data-go="top" aria-label="' + esc(t('to_top')) + '">' + logo(26) + '<span>Góc Nhỏ<small>Coffee</small></span></button>' +

      '</div></footer>';

  function fundInfo(d) {
    var rev = sum(d.tx, function (x) { return x.t === 'in' ? x.a : 0; });
    var cost = sum(d.tx, function (x) { return x.t === 'out' ? x.a : 0; });
    var profit = rev - cost;
    var alloc = Math.round(Math.max(0, profit) * d.fundPct / 100);
    var spent = sum(d.ws, function (w) { return w.cost; });
    return { profit: profit, alloc: alloc, spent: spent, left: alloc - spent };
  }

  function chartMonths(d) {
    var p = todayParts(), cur = p.y * 12 + p.m - 1;
    var start = cur - 5, end = cur;
    if (state.period === 'year') start = Math.min(p.y * 12, cur - 5);
    if (state.period === 'all') {
      d.tx.forEach(function (x) { var k = monthKey(x.d); if (k < start) start = k; if (k > end) end = k; });
      if (end - start > 23) start = end - 23;
    }
    var months = [];
    for (var k = start; k <= end; k++) months.push({ k: k, rev: 0, cost: 0, hl: monthInPeriod(k) });
    d.tx.forEach(function (x) {
      var i = monthKey(x.d) - start;
      if (i >= 0 && i < months.length) { if (x.t === 'in') months[i].rev += x.a; else months[i].cost += x.a; }
    });
    return months;
  }

  function breakdown(list, cats, color, title) {
    var tot = {};
    cats.forEach(function (c) { tot[c] = 0; });
    list.forEach(function (x) { tot[x.c] += x.a; });
    var rows = cats.map(function (c) { return { c: c, v: tot[c] }; }).filter(function (r) { return r.v > 0; })
      .sort(function (a, b) { return b.v - a.v; });
    var all = sum(rows, function (r) { return r.v; });
    var h = '<section class="panel"><div class="panel-h"><h2 class="panel-t">' + esc(title) + '</h2></div>';
    if (!rows.length) return h + '<p class="muted-note">' + esc(t('by_empty')) + '</p></section>';
    h += '<ul class="bars">';
    rows.forEach(function (r) {
      var share = Math.round(r.v / all * 100);
      var w = Math.max(1, r.v / rows[0].v * 100);
      h += '<li class="bar-row"><div class="bar-top"><span>' + esc(T[state.lang].cats[r.c]) + '</span><b>' + esc(money(r.v)) + '<small>' + share + '%</small></b></div>' +
        '<span class="bar-track" aria-hidden="true"><span class="bar-fill" style="width:' + w.toFixed(2) + '%;background:' + color + '"></span></span></li>';
    });
    return h + '</ul></section>';
  }

  function pendingHTML() {
    if (state.demo || !pending.length || (state.view !== 'ledger' && state.edit !== 'yes')) return '';

      '</div>';
  }

  /* ----------------------------------------------------------------- chart */
  function niceTicks(max) {
    if (!(max > 0)) return [0];
    var raw = max / 4;
    var p = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
    var steps = [1, 2, 2.5, 5, 10], step = p * 10;
    for (var i = 0; i < steps.length; i++) { if (steps[i] * p >= raw) { step = steps[i] * p; break; } }
    var top = Math.ceil(max / step) * step, out = [];
    for (var v = 0; v <= top + step / 1000; v += step) out.push(Math.round(v));
    return out;
  }
  function barPath(x, yTop, w, base) {
    var h = base - yTop;
    if (h <= 0) return '';
    var r = Math.min(4, h, w / 2);
    return 'M' + x + ' ' + base + 'V' + (yTop + r) + 'Q' + x + ' ' + yTop + ' ' + (x + r) + ' ' + yTop + 'H' + (x + w - r) +
      'Q' + (x + w) + ' ' + yTop + ' ' + (x + w) + ' ' + (yTop + r) + 'V' + base + 'Z';
  }
  var chartW = -1;
  function drawChart() {
    var host = document.getElementById('gn-chart');
    if (!host || !state.months) return;
    var months = state.months;
    chartW = Math.floor(host.clientWidth);
    var W = Math.max(260, chartW);
    var narrow = W < 520;
    var H = narrow ? 250 : 290, padL = 46, padR = 8, padT = 22, padB = 44;
    var plotW = W - padL - padR, plotH = H - padT - padB, base = padT + plotH;
    var max = 0;
    months.forEach(function (m) { max = Math.max(max, m.rev, m.cost); });
    if (state.planRev > 0) max = Math.max(max, state.planRev);
    var ticks = niceTicks(max), top = ticks[ticks.length - 1] || 1;
    var n = months.length, band = plotW / n;
    var barW = Math.max(3, Math.min(24, (band * 0.66 - 2) / 2));
    function y(v) { return base - v / top * plotH; }
    var every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(plotW / 46))));
    var s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="group" aria-label="' + esc(t('chart_aria')) + '">';
    ticks.forEach(function (tv) {
      var yy = Math.round(y(tv)) + 0.5;
      s += '<line class="' + (tv === 0 ? 'axis' : 'grid') + '" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + yy + '" y2="' + yy + '"/>' +
        '<text class="tick" x="' + (padL - 8) + '" y="' + (yy + 4) + '" text-anchor="end">' + esc(compact(tv)) + '</text>';
    });
    var lastRev = -1, yearShown = false;
    months.forEach(function (m, i) { if (m.rev > 0) lastRev = i; });
    months.forEach(function (m, i) {
      var x0 = padL + band * i, cx = x0 + band / 2;
      var label = monthLong(m.k) + ': ' + t('kpi_rev') + ' ' + money(m.rev) + ', ' + t('kpi_cost') + ' ' + money(m.cost);
      s += '<g class="band' + (m.hl ? '' : ' dim') + '" data-i="' + i + '" tabindex="0" role="img" aria-label="' + esc(label) + '">' +
        '<rect class="hit" x="' + x0.toFixed(1) + '" y="' + padT + '" width="' + band.toFixed(1) + '" height="' + plotH + '" rx="6"/>' +
        '<path class="bar" fill="var(--rev)" d="' + barPath(+(cx - barW - 1).toFixed(1), Math.min(base - (m.rev > 0 ? 2 : 0), y(m.rev)), +barW.toFixed(1), base) + '"/>' +
        '<path class="bar" fill="var(--cost)" d="' + barPath(+(cx + 1).toFixed(1), Math.min(base - (m.cost > 0 ? 2 : 0), y(m.cost)), +barW.toFixed(1), base) + '"/>' +
        '</g>';
      if ((n - 1 - i) % every === 0) {
        s += '<text class="xl" x="' + cx.toFixed(1) + '" y="' + (base + 18) + '" text-anchor="middle">' + esc(monthShort(m.k)) + '</text>';
        if (!yearShown || m.k % 12 === 0) {
          yearShown = true;
          s += '<text class="xl yr" x="' + cx.toFixed(1) + '" y="' + (base + 33) + '" text-anchor="middle">' + Math.floor(m.k / 12) + '</text>';
        }
      }
    });
    if (state.planRev > 0) {
      var py = Math.round(y(state.planRev)) + 0.5;
      s += '<line class="plan" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + py + '" y2="' + py + '"/>' +
        '<text class="pl" x="' + (padL + 6) + '" y="' + (py - 7) + '">' + esc(t('legend_plan') + ' ' + compact(state.planRev)) + '</text>';
    }
    if (lastRev >= 0) {
      var lm = months[lastRev], lx = padL + band * lastRev + band / 2 - barW / 2 - 1;
      var ly = Math.min(base - 2, y(lm.rev)) - 7;
      var anchor = lastRev === n - 1 ? 'end' : 'middle';
      var lxx = anchor === 'end' ? Math.min(W - padR, lx + barW / 2 + 2) : lx;
      s += '<text class="dl" x="' + lxx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="' + anchor + '">' + esc(compact(lm.rev)) + '</text>';
    }
    s += '</svg><div class="tip" id="gn-tip" aria-hidden="true"></div>';
    host.innerHTML = s;
    host.style.height = H + 'px';

    var tip = host.querySelector('#gn-tip');
    function show(g, px) {
      var m = months[+g.getAttribute('data-i')];
      Array.prototype.forEach.call(host.querySelectorAll('.band.on'), function (b) { b.classList.remove('on'); });
      g.classList.add('on');
      tip.textContent = '';
      var hd = document.createElement('div'); hd.className = 'tip-h'; hd.textContent = monthLong(m.k); tip.appendChild(hd);
      [[m.rev, t('kpi_rev'), 'var(--rev)'], [m.cost, t('kpi_cost'), 'var(--cost)']].forEach(function (r) {
        var row = document.createElement('div'); row.className = 'tip-row';
        var k = document.createElement('span'); k.className = 'tip-key'; k.style.background = r[2];
        var b = document.createElement('b'); b.textContent = money(r[0]);
        var i = document.createElement('i'); i.textContent = r[1];
        row.appendChild(k); row.appendChild(b); row.appendChild(i); tip.appendChild(row);
      });
      var sep = document.createElement('div'); sep.className = 'tip-sep'; tip.appendChild(sep);
      var pr = document.createElement('div'); pr.className = 'tip-row';
      var pk = document.createElement('span'); pk.className = 'tip-key';
      var pb = document.createElement('b'); pb.textContent = money(m.rev - m.cost);
      var pi = document.createElement('i'); pi.textContent = t('tip_profit');
      pr.appendChild(pk); pr.appendChild(pb); pr.appendChild(pi); tip.appendChild(pr);
      var i2 = +g.getAttribute('data-i');
      var cx = px != null ? px : padL + band * i2 + band / 2;
      var tw = tip.offsetWidth, th = tip.offsetHeight;
      var left = Math.max(0, Math.min(W - tw, cx - tw / 2));
      var topY = Math.min(y(m.rev), y(m.cost)) - th - 12;
      if (topY < -th / 2) topY = 4;
      tip.style.transform = 'translate(' + Math.round(left) + 'px,' + Math.round(topY) + 'px)';
      tip.classList.add('show');
    }
    function hide() {
      tip.classList.remove('show');
      Array.prototype.forEach.call(host.querySelectorAll('.band.on'), function (b) { b.classList.remove('on'); });
    }
    Array.prototype.forEach.call(host.querySelectorAll('.band'), function (g) {
      g.addEventListener('pointerenter', function () { show(g); });
      g.addEventListener('pointerdown', function () { show(g); });
      g.addEventListener('focus', function () { show(g); });
      g.addEventListener('blur', hide);
    });
    host.addEventListener('pointerleave', hide);
  }

  /* ------------------------------------------------------------- rendering */
  var root = document.getElementById('root');
  var toastEl = document.createElement('div');
  toastEl.className = 'toast';
  toastEl.setAttribute('role', 'status');
  toastEl.setAttribute('aria-live', 'polite');
  document.body.appendChild(toastEl);
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 3600);
  }

  function render() {
    var active = document.activeElement;
    var fk = active && active.getAttribute ? active.getAttribute('data-fk') : null;
    document.documentElement.lang = state.lang;
    root.innerHTML = navHTML() + '<main id="main">' + (state.view === 'ledger' ? ledgerHTML() : homeHTML()) + '</main>' + footerHTML() + pendingHTML();
    if (state.view === 'ledger' && !state.chartTable) drawChart();
    if (state.view === 'home') updateModel();
    syncNav();
    if (fk) { var el = root.querySelector('[data-fk="' + fk + '"]'); if (el) el.focus({ preventScroll: true }); }
  }
  function renderPending() {
    var old = root.querySelector('.pending');
    var html = pendingHTML();
    if (old) old.outerHTML = html || '';
    else if (html) root.insertAdjacentHTML('beforeend', html);
  }
  function syncNav() {
    var nav = document.getElementById('nav');
    if (!nav) return;
    var hero = document.getElementById('top');
    var dark = state.view === 'home' && hero && window.scrollY < hero.offsetHeight - 72 && !nav.classList.contains('menu-open');
    nav.classList.toggle('on-dark', !!dark);
  }
  var navTick = false;
  window.addEventListener('scroll', function () {
    if (navTick) return;
    navTick = true;
    requestAnimationFrame(function () { navTick = false; syncNav(); });
  }, { passive: true });
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var host = document.getElementById('gn-chart');
      if (state.view === 'ledger' && !state.chartTable && host && Math.floor(host.clientWidth) !== chartW) drawChart();
      var mh = document.getElementById('m-chart');
      if (state.view === 'home' && mh && Math.floor(mh.clientWidth) !== modelW) updateModel();
    }, 120);
  });
  window.addEventListener('hashchange', function () {
    var v = viewFromHash();
    if (v !== state.view) { state.view = v; render(); window.scrollTo(0, 0); }
  });

  function reduceMotion() {
    try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
  }
  function closeMenu() {
    var links = document.getElementById('nav-links'), btn = root.querySelector('.menu-btn'), nav = document.getElementById('nav');
    if (links) links.classList.remove('open');
    if (nav) nav.classList.remove('menu-open');
    if (btn) { btn.setAttribute('aria-expanded', 'false'); btn.textContent = t('menu'); }
    syncNav();
  }
  function go(target) {
    closeMenu();
    if (target === 'ledger') {
      if (state.view !== 'ledger') { state.view = 'ledger'; render(); }
      if (location.hash !== '#ledger') location.hash = 'ledger';
      window.scrollTo(0, 0);
      return;
    }
    if (state.view !== 'home') {
      state.view = 'home';
      render();
      if (location.hash) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; } }
    }
    if (target === 'top') { window.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' }); return; }
    var el = document.getElementById(target);
    if (el) el.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
  }

  /* --------------------------------------------------------------- actions */
  function pushOp(op) { pending.push(op); savePending(); }
  function removeOps(pred) { pending = pending.filter(function (op) { return !pred(op); }); savePending(); }

  function deleteItem(kind, id) {
    var addName = kind === 'tx' ? 'addTx' : 'addWs', delName = kind === 'tx' ? 'delTx' : 'delWs';
    var isNew = pending.some(function (op) { return op.op === addName && op.item.id === id; });
    if (isNew) removeOps(function (op) { return op.op === addName && op.item.id === id; });
    else if (!pending.some(function (op) { return op.op === delName && op.id === id; })) pushOp({ op: delName, id: id });
    render();
  }
  function undoDelete(kind, id) {
    var delName = kind === 'tx' ? 'delTx' : 'delWs';
    removeOps(function (op) { return op.op === delName && op.id === id; });
    render();
  }

  function submitTx(form) {
    var f = state.form.tx;
    state.errors = {};
    var a = parseAmount(f.a);
    if (!ISO.test(f.d)) state.errors.tx_d = t('err_date');
    if (!(a > 0) || a >= 1e13) state.errors.tx_a = t('err_amount');
    if (Object.keys(state.errors).length) { render(); focusFirstError(); return; }
    var cats = f.t === 'in' ? IN_CATS : OUT_CATS;
    var item = { id: uid(), d: f.d, t: f.t, c: cats.indexOf(f.c) >= 0 ? f.c : cats[0], a: a, n: f.n.trim().slice(0, 140) };
    pushOp({ op: 'addTx', item: item });
    f.a = ''; f.n = '';
    if (!periodMatch(item.d)) state.period = 'all';
    render();
    var amt = document.getElementById('tx-a');
    if (amt) amt.focus({ preventScroll: true });
    toast(t('added_tx'));
  }
  function submitWs() {
    var f = state.form.ws;
    state.errors = {};
    var kids = f.kids === '' ? 0 : Number(String(f.kids).replace(/[^\d.-]/g, ''));
    var cost = String(f.cost).trim() === '' ? 0 : parseAmount(f.cost);
    if (!ISO.test(f.d)) state.errors.ws_d = t('err_date');
    if (!f.title.trim()) state.errors.ws_title = t('err_title');
    if (!(kids >= 0) || Math.round(kids) !== kids || kids > 100000) state.errors.ws_kids = t('err_kids');
    if (!(cost >= 0) || cost >= 1e12) state.errors.ws_cost = t('err_cost');
    if (Object.keys(state.errors).length) { render(); focusFirstError(); return; }
    var item = { id: uid(), d: f.d, title: f.title.trim().slice(0, 100), track: TRACKS.indexOf(f.track) >= 0 ? f.track : 'art', kids: kids, cost: cost, n: f.n.trim().slice(0, 140) };
    pushOp({ op: 'addWs', item: item });
    f.title = ''; f.kids = ''; f.cost = ''; f.n = '';
    if (!periodMatch(item.d)) state.period = 'all';
    render();
    toast(t('added_ws'));
  }
  function submitFund() {
    state.errors = {};
    var raw = String(state.form.pct === '' ? current().fundPct : state.form.pct).trim().replace(',', '.');
    var v = Number(raw);
    if (raw === '' || !isFinite(v) || v < 0 || v > 100) { state.errors.pct = t('err_pct'); render(); focusFirstError(); return; }
    v = Math.round(v);
    var now = current().fundPct;
    removeOps(function (op) { return op.op === 'setFund'; });
    if (v !== SAVED.fundPct) pushOp({ op: 'setFund', value: v });
    state.form.pct = '';
    state.model.fundPct = v;
    render();
    toast(v === now ? t('pct_same') : t('pct_set'));
  }
  function focusFirstError() {
    var el = root.querySelector('[aria-invalid="true"]');
    if (el) el.focus();
  }

  function save() {
    if (state.saving || state.demo || !artifactCap || !pending.length) return;
    var next = applyOps(SAVED, pending);
    next.updatedAt = new Date().toISOString();
    var html = buildDocument(next);
    state.saving = true;
    renderPending();
    sSet(SS, 'gn-after-save', String(pending.length));
    sSet(SS, 'gn-view', state.view);
    sSet(SS, 'gn-scroll', String(Math.round(window.scrollY || 0)));
    Promise.resolve().then(function () { return artifactCap.publish(html); }).then(function () {
      /* the platform reloads every open view to the new version; the flag lets
         the reloaded page confirm the save, and expires if no reload comes */
      setTimeout(function () { sDel(SS, 'gn-after-save'); }, 6000);
      SAVED = normalize(next);
      pending = pending.filter(function (op) { return !opApplied(op, SAVED); });
      savePending();
      state.saving = false;
      render();
      toast(t('saved'));
    }, function (err) {
      sDel(SS, 'gn-after-save');
      state.saving = false;
      var code = err && err.code;
      if (code === 'conflict') toast(t('save_conflict'));
      else if (code === 'not_granted' || code === 'not_writer') { state.edit = 'no'; toast(t('save_denied')); }
      else toast(t('save_error'));
      render();
    });
  }

  function csv() {
    var d = current();
    var L = T[state.lang];
    var head = state.lang === 'vi' ? ['Ngày', 'Loại', 'Nhóm', 'Số tiền', 'Ghi chú'] : ['Date', 'Type', 'Category', 'Amount', 'Note'];
    function q(v) { v = String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    var lines = [head.join(',')];
    d.tx.slice().sort(byDateDesc).forEach(function (x) {
      lines.push([x.d, x.t === 'in' ? L.f_in : L.f_out, L.cats[x.c], x.t === 'in' ? x.a : -x.a, x.n].map(q).join(','));
    });
    return lines.join('\n');
  }

  /* demo data: generated in memory only, clearly labelled, never published */
  function makeDemo() {
    var seed = 20261117;
    function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var r = Math.imul(seed ^ seed >>> 15, 1 | seed); r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }
    var p = todayParts(), cur = p.y * 12 + p.m - 1, tx = [], ws = [], id = 0;
    function iso(k, day) { return Math.floor(k / 12) + '-' + pad(k % 12 + 1) + '-' + pad(day); }
    function add(type, c, a, k, day) { tx.push({ id: 'demo' + (id++), d: iso(k, day), t: type, c: c, a: Math.round(a / 1000) * 1000, n: '' }); }
    var titles = [['Vẽ tranh cao nguyên', 'art'], ['Hành trình hạt cà phê', 'coffee'], ['Tô màu chiếc ly của em', 'art'], ['Ngửi và đoán hương cà phê', 'coffee']];
    for (var back = 5; back >= 0; back--) {
      var k = cur - back, last = back === 0 ? p.d : new Date(Math.floor(k / 12), k % 12 + 1, 0).getDate(), g = (5 - back) * 0.32e6;
      [7, 14, 21, 28].forEach(function (day, w) {
        if (day > last) return;
        add('in', 'drinks', 5.4e6 + rnd() * 2.2e6 + g, k, day);
        if (w % 2 === 0) add('in', 'food', 0.9e6 + rnd() * 0.7e6, k, day);
      });
      if (20 <= last) add('in', 'beans', 1.1e6 + rnd() * 0.9e6, k, 20);
      add('out', 'rent', 6e6, k, 1);
      if (5 <= last) add('out', 'utilities', 1.05e6 + rnd() * 0.45e6, k, 5);
      [3, 17].forEach(function (day) { if (day <= last) add('out', 'ingredients', 2.1e6 + rnd() * 1.1e6, k, day); });
      if (28 <= last) add('out', 'staff', 4e6, k, 28);
      if (back === 5) add('out', 'equipment', 3.6e6, k, 2);
      if (back % 3 === 2 && 10 <= last) add('out', 'marketing', 0.8e6, k, 10);
      if (back <= 3 && 15 <= last) {
        var tt = titles[3 - back];
        ws.push({ id: 'demows' + back, d: iso(k, 15), title: tt[0], track: tt[1], kids: 10 + Math.round(rnd() * 8), cost: Math.round((0.4e6 + rnd() * 0.5e6) / 1000) * 1000, n: '' });
      }
    }
    return normalize({ v: 1, fundPct: 30, tx: tx, ws: ws, updatedAt: null });
  }

  /* ---------------------------------------------------------------- events */
  root.addEventListener('click', function (e) {
    var el = e.target.closest('button');
    if (!el || !root.contains(el)) return;
    var a;
    if ((a = el.getAttribute('data-go'))) { go(a); return; }
    if ((a = el.getAttribute('data-lang'))) {
      if (a !== state.lang) { state.lang = a; sSet(LS, 'gn-lang', a); state.errors = {}; render(); }
      return;
    }
    if ((a = el.getAttribute('data-period'))) { state.period = a; state.txLimit = 20; render(); return; }
    if ((a = el.getAttribute('data-tab'))) { state.tab = a; state.errors = {}; render(); return; }
    if ((a = el.getAttribute('data-del-tx'))) { deleteItem('tx', a); return; }
    if ((a = el.getAttribute('data-undo-tx'))) { undoDelete('tx', a); return; }
    if ((a = el.getAttribute('data-del-ws'))) { deleteItem('ws', a); return; }
    if ((a = el.getAttribute('data-undo-ws'))) { undoDelete('ws', a); return; }
    if ((a = el.getAttribute('data-menu-edit'))) {
      var it = menuOf(working()).filter(function (x) { return x.id === a; })[0];
      if (it) {
        state.menuEdit = { id: it.id, vi: it.vi, en: it.en, dvi: it.dvi, den: it.den, cat: it.cat, price: String(it.price), cost: String(it.cost), sig: it.sig };
        state.errors = {}; render();
        var ev = document.getElementById('me-vi'); if (ev) ev.focus();
      }
      return;
    }
    if ((a = el.getAttribute('data-menu-del'))) {
      setMenuOp(menuOf(working()).filter(function (x) { return x.id !== a; }));
      render(); toast(t('menu_deleted'));
      return;
    }
    a = el.getAttribute('data-act');
    if (a === 'menu') {
      var links = document.getElementById('nav-links'), nav = document.getElementById('nav');
      var open = !links.classList.contains('open');
      links.classList.toggle('open', open);
      nav.classList.toggle('menu-open', open);
      el.setAttribute('aria-expanded', String(open));
      el.textContent = open ? t('close') : t('menu');
      syncNav();
    } else if (a === 'chart-table') { state.chartTable = !state.chartTable; render(); }
    else if (a === 'plan-save') { savePlan(); }
    else if (a === 'plan-reset') { state.model = modelFrom(working()); rerenderModel(); var rb = root.querySelector('[data-act="plan-reset"]'); if (rb) rb.focus({ preventScroll: true }); }
    else if (a === 'edit-menu') { state.tab = 'menu'; state.menuEdit = null; state.errors = {}; go('ledger'); }
    else if (a === 'menu-new') {
      state.menuEdit = { id: 'new', vi: '', en: '', dvi: '', den: '', cat: 'coffee', price: '', cost: '', sig: false };
      state.errors = {}; render();
      var nv = document.getElementById('me-vi'); if (nv) nv.focus();
    }
    else if (a === 'menu-cancel') { state.menuEdit = null; state.errors = {}; render(); }
    else if (a === 'more') { state.txLimit += 20; render(); }
    else if (a === 'demo') { state.demoData = makeDemo(); state.demo = true; state.period = 'month'; render(); window.scrollTo(0, 0); }
    else if (a === 'demo-exit') { state.demo = false; state.demoData = null; render(); window.scrollTo(0, 0); }
    else if (a === 'discard') { pending = []; savePending(); render(); toast(t('discarded')); }
    else if (a === 'save') { save(); }
    else if (a === 'csv') {
      var text = csv();
      try {
        navigator.clipboard.writeText(text).then(function () { toast(t('copied')); }, function () { toast(t('copy_fail')); });
      } catch (err) { toast(t('copy_fail')); }
    }
  });

  root.addEventListener('submit', function (e) {
    e.preventDefault();
    var form = e.target.closest('form[data-form]');
    if (!form) return;
    if (state.edit !== 'yes' || state.demo) return;
    var kind = form.getAttribute('data-form');
    if (kind === 'tx') submitTx(form);
    else if (kind === 'ws') submitWs(form);
    else if (kind === 'fund') submitFund(form);
    else if (kind === 'menu') submitMenu();
  });

  function onField(e) {
    var el = e.target;
    var form = el.closest && el.closest('form[data-form]');
    if (!form || !el.name) return;
    var kind = form.getAttribute('data-form');
    if (kind === 'fund') { state.form.pct = el.value; return; }
    if (kind === 'menu') { if (state.menuEdit) state.menuEdit[el.name] = el.type === 'checkbox' ? el.checked : el.value; return; }
    var f = state.form[kind];
    if (!f || !(el.name in f)) return;
    if (el.type === 'radio') {
      if (!el.checked) return;
      f.t = el.value;
      f.c = (el.value === 'in' ? IN_CATS : OUT_CATS)[0];
      render();
      var r = root.querySelector('input[name="t"][value="' + el.value + '"]');
      if (r) r.focus({ preventScroll: true });
      return;
    }
    f[el.name] = el.value;
    if (kind === 'tx' && el.name === 'a') {
      var hint = document.getElementById('hint-a');
      if (hint) hint.outerHTML = amountHint(el.value);
    }
  }
  root.addEventListener('input', function (e) {
    var el = e.target;
    if (el.closest && el.closest('#m-form')) { onModelInput(el); return; }
    onField(e);
  });
  root.addEventListener('change', function (e) {
    if (e.target.closest && e.target.closest('#m-form')) return;
    onField(e);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      var links = document.getElementById('nav-links');
      if (links && links.classList.contains('open')) { closeMenu(); var b = root.querySelector('.menu-btn'); if (b) b.focus(); }
    }
  });

  /* ---------------------------------------------------------- capabilities */
  function initCaps() {
    var C = window.claude;
    if (!C || typeof C.use !== 'function') { setEdit('no'); return; }
    var done = false;
    var timer = setTimeout(function () { if (!done) { done = true; setEdit('no'); } }, 12000);
    Promise.resolve().then(function () { return C.use('artifact'); }).then(function (art) {
      artifactCap = art || null;
      if (!artifactCap || typeof artifactCap.publish !== 'function') return 'no';
      return Promise.resolve().then(function () { return C.use('user'); }).then(function (u) {
        if (!u || typeof u.canEdit !== 'function') return 'yes';
        return Promise.resolve().then(function () { return u.canEdit(); }).then(function (v) { return v === false ? 'no' : 'yes'; }, function () { return 'yes'; });
      }, function () { return 'yes'; });
    }).then(function (res) {
      if (done) return;
      done = true; clearTimeout(timer); setEdit(res);
    }, function () {
      if (done) return;
      done = true; clearTimeout(timer); setEdit('no');
    });
  }
  function setEdit(v) {
    if (state.edit === v) return;
    state.edit = v;
    if (state.view === 'ledger') render();
    else { syncOwnerBits(); renderPending(); }
  }
  function syncOwnerBits() {
    Array.prototype.forEach.call(root.querySelectorAll('.owner-only'), function (el) { el.hidden = state.edit !== 'yes'; });
  }

  window.GocNho = { build: buildDocument, data: function () { return current(); } };

  render();
  if (restoreScroll) { var rs = restoreScroll; requestAnimationFrame(function () { window.scrollTo(0, rs); }); }
  if (lastSave) toast(pending.length ? t('save_conflict') : t('saved'));
  initCaps();
})();
</script>
</body>
</html>
